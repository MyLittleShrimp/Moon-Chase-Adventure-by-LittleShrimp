<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>追月行动 · 操作检查（不写存档）</title><link rel="stylesheet" href="style.css"><style>.audit-nav{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:center;gap:8px;background:#061622;padding:5px}.audit-nav button{padding:5px 12px;background:#234458;border:1px solid #91acb5}.audit-nav label{display:flex;align-items:center;gap:4px;font-size:12px}.game-frame{background:#0d263b}</style></head>
<body><nav class="audit-nav" aria-label="测试关卡"><button data-puzzle="snake">贪吃蛇</button><button data-puzzle="traffic">智慧交通</button><button data-puzzle="factory">能源推箱</button><button data-puzzle="water">智慧水务</button><label><input type="checkbox" id="cancel-drag">测试中断拖拽</label></nav><main class="shell"><section class="game-column"><div class="game-frame"><canvas id="world" width="540" height="960" aria-hidden="true"></canvas><div class="modal-backdrop"><section id="modal" class="modal" tabindex="-1"></section></div></div></section></main>
<script type="module">
import {createPuzzles} from './puzzles.js';
const $=s=>document.querySelector(s),keys=new Set();let tick=null,onKey=null,last=performance.now();
const games=createPuzzles({$,keys,open(html){tick=null;onKey=null;keys.clear();$('#modal').innerHTML='<button class="modal-sound">♪ 声音关</button>'+html;$('#modal').scrollTop=0;},close(){tick=null;onKey=null;$('#modal').innerHTML='<p>已返回。选择顶部关卡继续检查。</p>';},header(k,t,p){return `<div class="eyebrow">${k}</div><h2>${t}</h2><p>${p}</p>`;},setTick:f=>tick=f,setKeys:f=>onKey=f,sound(){},loop(){},isReplay:()=>true,complete(){tick=null;onKey=null;$('#modal').innerHTML='<p>挑战完成，已确认返回。</p>';}});
document.querySelectorAll('[data-puzzle]').forEach(b=>b.onclick=()=>games[b.dataset.puzzle]());
document.addEventListener('keydown',e=>{keys.add(e.key);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)){e.preventDefault();onKey?.(e.key,e.repeat);}});document.addEventListener('keyup',e=>keys.delete(e.key));
// An opt-in UI control exercises the production lost-pointer-capture path.
document.addEventListener('pointermove',e=>{const active=$('.vehicle.dragging');if($('#cancel-drag').checked&&active?.hasPointerCapture(e.pointerId))active.releasePointerCapture(e.pointerId);});
function frame(now){tick?.(Math.min(.05,(now-last)/1000));last=now;requestAnimationFrame(frame);}requestAnimationFrame(frame);games.traffic();
</script></body></html>
